name: iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign) — surfaces real errors
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Show any errors
        if: always()
        run: |
          echo "########## ERRORS ##########"
          grep -nE "error:|error generated|CompileAssetCatalog|SwiftCompile|cannot find|no such module|has no member" /tmp/build.log | grep -iv "CoreSimulator" | head -100 || echo "no matches"
          echo "########## LAST 40 LINES ##########"
          tail -40 /tmp/build.log
          echo "########## END ##########"

      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Install signing (fastlane)
        run: |
          gem install fastlane
          fastlane run app_store_connect_api_key \
            key_id:"${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            issuer_id:"${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            key_filepath:"$HOME/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist || echo "IPA build attempted"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa