name: iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install iOS platform SDK
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "retry $i..."
            sleep 15
          done
        continue-on-error: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Add Streaming files to Xcode target
        run: |
          gem install xcodeproj
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          runner_group = project.main_group['Runner']

          # clean any prior broken Streaming group
          existing = runner_group['Streaming']
          existing.remove_from_project if existing

          # group path is relative to parent (Runner) -> just 'Streaming'
          streaming_group = runner_group.new_group('Streaming', 'Streaming')

          %w[
            HaishinKitStreamer.swift
            CameraPreviewFactory.swift
            ScoreboardRenderer.swift
            StreamingHandler.swift
          ].each do |file|
            # remove stale build-file refs to this filename
            target.source_build_phase.files.dup.each do |bf|
              if bf.file_ref && bf.file_ref.path && bf.file_ref.path.end_with?(file)
                target.source_build_phase.remove_build_file(bf)
              end
            end
            ref = streaming_group.new_reference(file)
            target.add_file_references([ref])
            puts "Added: #{file} (path=#{ref.real_path})"
          end

          project.save
          puts "saved"
          RUBY

      - name: Install CocoaPods
        run: |
          cd ios && pod install --repo-update && cd ..

      - name: Install signing tools & fetch certs
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          openssl genrsa -out ~/private_keys/cert_key.pem 2048
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key @file:~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --certificate-key @file:~/private_keys/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build signed IPA
        run: |
          set -o pipefail
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist 2>&1 | tee /tmp/ipa.log

      - name: Show IPA errors (if any)
        if: always()
        run: |
          echo "########## IPA ERRORS ##########"
          if [ -f /tmp/ipa.log ]; then
            grep -nE "error:|Encountered error|Cannot find|no such module|Build input files" /tmp/ipa.log | head -60 || echo "none"
            echo "########## LAST 30 ##########"
            tail -30 /tmp/ipa.log
          else
            echo "no ipa.log"
          fi

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA path: $IPA"
          if [ -n "$IPA" ]; then
            app-store-connect publish \
              --path "$IPA" \
              --issuer-id "$ASC_ISSUER_ID" \
              --key-id "$ASC_KEY_ID" \
              --private-key @file:~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            echo "No IPA produced"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            /tmp/ipa.log
            build/ios/ipa/*.ipa
