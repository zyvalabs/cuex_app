name: iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version
          echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Add Streaming files to Xcode target
        run: |
          gem install xcodeproj
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          runner_group = project.main_group['Runner']
          existing = runner_group['Streaming']
          existing.remove_from_project if existing
          streaming_group = runner_group.new_group('Streaming', 'Streaming')
          %w[
            HaishinKitStreamer.swift
            CameraPreviewFactory.swift
            ScoreboardRenderer.swift
            StreamingHandler.swift
          ].each do |file|
            target.source_build_phase.files.dup.each do |bf|
              if bf.file_ref && bf.file_ref.path && bf.file_ref.path.end_with?(file)
                target.source_build_phase.remove_build_file(bf)
              end
            end
            ref = streaming_group.new_reference(file)
            target.add_file_references([ref])
            puts "Added: #{file}"
          end
          project.save
          RUBY

      - name: Flutter config-only (generates iOS build config, no archive)
        run: flutter build ios --release --config-only --no-codesign

      - name: Install CocoaPods (fresh)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: RAW xcodebuild — shows all Swift errors
        run: |
          set +e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/raw.log
          echo ""
          echo "===================== SWIFT ERRORS ====================="
          grep -nE "error:" /tmp/raw.log | head -100 || echo "NONE — code compiles clean!"
          echo "===================== END ====================="

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-log
          path: /tmp/raw.log
