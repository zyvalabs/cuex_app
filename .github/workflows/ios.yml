name: iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS (no codesign) — surfaces real errors
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Show any errors
        if: always()
        run: |
          echo "########## ERRORS ##########"
          grep -nE "error:|error generated|CompileAssetCatalog|SwiftCompile|Cannot find|no such module|has no member|Consecutive declarations" /tmp/build.log | grep -iv "CoreSimulator" | head -100 || echo "no matches"
          echo "########## LAST 40 LINES ##########"
          tail -40 /tmp/build.log
          echo "########## END ##########"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log