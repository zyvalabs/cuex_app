name: iOS Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          xcodebuild -version
          echo "TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install CocoaPods (fresh)
        run: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Install signing tools & fetch certs
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          openssl genrsa -out ~/private_keys/cert_key.pem 2048
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key @file:~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --certificate-key @file:~/private_keys/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Create ExportOptions.plist
        run: |
          cat > $HOME/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>5XC93XX8X6</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist 2>&1 | tee /tmp/ipa.log

      - name: Show result
        if: always()
        run: |
          echo "===== errors ====="
          grep -nE "error:|Encountered error" /tmp/ipa.log | head -40 || echo "none"
          echo "===== ipa check ====="
          ls -la build/ios/ipa/ 2>/dev/null || echo "no ipa"

      - name: Upload to TestFlight
        if: success()
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          if [ -n "$IPA" ]; then
            app-store-connect publish \
              --path "$IPA" \
              --issuer-id "$ASC_ISSUER_ID" \
              --key-id "$ASC_KEY_ID" \
              --private-key @file:~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          else
            echo "No IPA"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            /tmp/ipa.log
            build/ios/ipa/*.ipa