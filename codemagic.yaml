workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zyvalabs.cuex

    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
          echo "========== HAISHINKIT VERSION =========="
          grep -n "HaishinKit" ios/Podfile.lock || echo "HaishinKit NOT FOUND"
          echo "========================================"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
