workflows:
  ios-workflow:
    name: iOS Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
          echo "========== HAISHINKIT VERSION =========="
          grep -n "HaishinKit" ios/Podfile.lock || echo "HaishinKit NOT FOUND"
          echo "========================================"

      - name: Archive check (prints Swift errors)
        script: |
          set +e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath /tmp/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee /tmp/compile.log
          echo ""
          echo "########## SWIFT ERRORS ##########"
          grep -n "error:" /tmp/compile.log | head -80 || echo "NO ERRORS FOUND"
          echo ""
          echo "########## SWIFT WARNINGS (Streaming) ##########"
          grep -n "Streaming/" /tmp/compile.log | head -40 || echo "none"
          echo "########## END ##########"
          exit 0

    artifacts:
      - /tmp/compile.log