workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.zyvalabs.cuex"

    scripts:
      - name: Disable Swift Package Manager
        script: flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter build (no codesign)
        script: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/fb.log
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "########## SWIFT ERRORS (flutter log) ##########"
          grep -n "error:" /tmp/fb.log | head -80 || echo "none in flutter log"
          echo ""
          echo "########## RAW XCODEBUILD ERRORS ##########"
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -n "error:" | head -80 || echo "none in raw log"
          echo "########## END ##########"
          exit $STATUS

      - name: Package IPA (signed)
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/fb.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
