workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.zyvalabs.cuex"

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
          echo "========== HAISHINKIT VERSION =========="
          grep -n "HaishinKit" ios/Podfile.lock || echo "HaishinKit NOT FOUND in Podfile.lock"
          echo "========================================"

      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        script: |
          set +e
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo ""
          echo "########## SWIFT ERRORS ##########"
          grep -n "error:" /tmp/build.log | head -100 || echo "no error: lines found"
          echo ""
          echo "########## STREAMING FILE REFS ##########"
          grep -n "Streaming/" /tmp/build.log | head -40 || echo "none"
          echo ""
          echo "########## END ##########"
          exit $BUILD_STATUS

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/build.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
