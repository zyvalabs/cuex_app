workflows:
  ios-workflow:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.zyvalabs.cuex

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
          echo "========== HAISHINKIT VERSION =========="
          grep -n "HaishinKit" ios/Podfile.lock || echo "HaishinKit NOT FOUND"
          echo "========================================"

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Compile check (prints Swift errors)
        script: |
          set +e
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee /tmp/compile.log
          echo ""
          echo "########## SWIFT ERRORS ##########"
          grep -n "error:" /tmp/compile.log | head -80 || echo "NO ERRORS FOUND"
          echo "########## END ERRORS ##########"
          exit 0

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/compile.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
